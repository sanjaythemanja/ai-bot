# App settings. Secrets (API keys, OAuth) stay in .env.

# true  = send_email and create_event wait in "Pending actions" until you click Approve.
# false = they run immediately (still listed in the Actions panel as a log).
#         Note: with false, the AI can send email on its own. Instructions hidden
#         in an incoming email could try to trigger that, so keep true unless you
#         trust every message the assistant will read.
require_approval: true

# After you click Approve, the action waits this many seconds (with an Undo
# button) before it actually runs. 0 = run immediately.
undo_seconds: 30

# true  = every assistant reply is read aloud in the browser (typed or spoken).
# false = replies are never read aloud.
read_replies_aloud: false
